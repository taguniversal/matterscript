[book]
title = "MatterScript: A Programmer's Guide to Space-Time Computing"
authors = ["MatterScript Core Team"]
description = "Building Physically-Faithful Software and Hardware Systems"
language = "en"
src = "src"

[build]
build-dir = "book/html"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
smart-punctuation = true
mathjax-support = true
additional-js = ["grammars/matterscript.js"]

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3

