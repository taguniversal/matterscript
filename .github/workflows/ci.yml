name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          zig-version: 7db2ef610  # Or "master" for nightly, or omit to read minimum_zig_version from build.zig.zon

      - name: Run Tests
        run: zig build test

      - name: Verify Build
        run: zig build --summary all